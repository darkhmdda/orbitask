name: Release Orbitask Linux v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build and publish Linux v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_REDIRECT_URL: com.darkhmdda.orbitask://login-callback
        run: |
          : "${SUPABASE_URL:?Falta la variable de repositorio SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Falta la variable de repositorio SUPABASE_PUBLISHABLE_KEY}"
          flutter build linux --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_AUTH_REDIRECT_URL="$SUPABASE_AUTH_REDIRECT_URL"

      - name: Build Debian package
        run: bash installer/linux/build_deb.sh

      - name: Create portable archive
        run: |
          tar -C build/linux/x64/release/bundle \
            -czf Orbitask-v1.0.0-linux-x64-portable.tar.gz .

          cp installer/linux/output/Orbitask-v1.0.0-linux-amd64.deb \
            Orbitask-v1.0.0-linux-amd64.deb

      - name: Generate SHA-256
        run: |
          sha256sum \
            Orbitask-v1.0.0-linux-amd64.deb \
            Orbitask-v1.0.0-linux-x64-portable.tar.gz \
            > SHA256SUMS-linux-v1.0.0.txt

      - name: Publish Linux assets to official v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}"

          gh release upload v1.0.0 \
            Orbitask-v1.0.0-linux-amd64.deb \
            Orbitask-v1.0.0-linux-x64-portable.tar.gz \
            SHA256SUMS-linux-v1.0.0.txt \
            --repo "${{ github.repository }}" \
            --clobber
