name: Release Orbitask Windows

# Compila Windows x64 (instalador de Inno Setup y ZIP portable) de la rama
# elegida en "Use workflow from" y lo deja en el BORRADOR de release de la
# etiqueta. Si Android o Linux ya crearon ese borrador, los archivos se añaden
# a él. Nunca publica ni modifica una release ya publicada. Ver
# .github/scripts/release_draft.sh.
#
# Necesita en Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (por ejemplo v1.1.0 o v0.22-dev)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release (solo si este workflow crea el borrador)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that the release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/release_draft.sh check "$TAG"

  build-windows:
    name: Build Windows ${{ inputs.tag }}
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: powershell
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_REDIRECT_URL: com.darkhmdda.orbitask://login-callback
          TAG: ${{ inputs.tag }}
        run: |
          if (-not $env:SUPABASE_URL) { throw "Falta la variable de repositorio SUPABASE_URL" }
          if (-not $env:SUPABASE_PUBLISHABLE_KEY) { throw "Falta la variable de repositorio SUPABASE_PUBLISHABLE_KEY" }
          flutter build windows --release `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY `
            --dart-define=SUPABASE_AUTH_REDIRECT_URL=$env:SUPABASE_AUTH_REDIRECT_URL `
            --dart-define=ORBITASK_TAG=$env:TAG
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows fallo con codigo $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      # El instalador lleva la versión del pubspec (Windows la muestra en
      # "Aplicaciones instaladas"); el nombre del archivo lleva la etiqueta.
      - name: Build setup, portable ZIP and checksums
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $appVersion = $pubspecVersion.Split('+')[0]

          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Source
          }
          if (-not $iscc) { throw "No se encontro ISCC.exe" }

          & $iscc "/DMyAppVersion=$appVersion" "installer/orbitask.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallo con codigo $LASTEXITCODE" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $setup = "Orbitask-$env:TAG-windows-setup.exe"
          $portable = "Orbitask-$env:TAG-windows-x64-portable.zip"

          Copy-Item "installer/output/Orbitask-v$appVersion-windows-setup.exe" "dist/$setup" -Force
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/$portable" -Force

          $lines = foreach ($file in @($setup, $portable)) {
            $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          # Sin BOM y con saltos de línea LF, para que sha256sum -c funcione.
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/SHA256SUMS-windows-$env:TAG.txt"),
            (($lines -join "`n") + "`n"))

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-windows
          path: dist/

  publish:
    name: Publish Windows ${{ inputs.tag }}
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mismo grupo en Android, Linux y Windows: la publicación de una etiqueta
    # va en serie para que no se creen dos borradores a la vez.
    concurrency:
      group: release-publish-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-windows
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          bash .github/scripts/release_draft.sh publish "$TAG" "$PRERELEASE" \
            "dist/Orbitask-$TAG-windows-setup.exe" \
            "dist/Orbitask-$TAG-windows-x64-portable.zip" \
            "dist/SHA256SUMS-windows-$TAG.txt"
