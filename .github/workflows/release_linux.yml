name: Release Orbitask Linux

# Compila Linux x64 (paquete .deb y archivo portable) de la rama elegida en
# "Use workflow from" y lo deja en el BORRADOR de release de la etiqueta. Si
# Android o Windows ya crearon ese borrador, los archivos se añaden a él.
# Nunca publica ni modifica una release ya publicada. Ver
# .github/scripts/release_draft.sh.
#
# Necesita en Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (por ejemplo v1.1.0 o v0.22-dev)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release (solo si este workflow crea el borrador)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux ${{ inputs.tag }}
    # Fijado a 24.04 a propósito. ubuntu-latest pasó a 26.04, cuyo compilador
    # marca el ejecutable como x86-64-v3 (AVX2): en CPU sin AVX2 (el
    # Chromebook) no arranca ("CPU ISA level is lower than required"). Además
    # 24.04 enlaza contra una glibc más antigua, así que el paquete funciona
    # en más distribuciones.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that the release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/release_draft.sh check "$TAG"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_REDIRECT_URL: com.darkhmdda.orbitask://login-callback
          TAG: ${{ inputs.tag }}
        run: |
          : "${SUPABASE_URL:?Falta la variable de repositorio SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Falta la variable de repositorio SUPABASE_PUBLISHABLE_KEY}"
          flutter build linux --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_AUTH_REDIRECT_URL="$SUPABASE_AUTH_REDIRECT_URL" \
            --dart-define=ORBITASK_TAG="$TAG"

      # Red de seguridad: si algún binario exige x86-64-v3 o v4 (AVX2 o
      # AVX-512), no arrancaría en CPU más antiguas. Mejor fallar aquí.
      - name: Check CPU requirements of the binaries
        run: |
          bad=0
          for f in build/linux/x64/release/bundle/orbitask build/linux/x64/release/bundle/lib/*.so; do
            isa="$(readelf -n "$f" | grep 'x86 ISA needed' || true)"
            echo "$f: ${isa:-sin marca ISA}"
            if echo "$isa" | grep -qE 'x86-64-v(3|4)'; then
              echo "::error file=$f::Exige x86-64-v3 o superior y no arrancaría en CPU sin AVX2."
              bad=1
            fi
          done
          exit "$bad"

      # El paquete .deb lleva la versión del pubspec (dpkg exige un número de
      # versión); el nombre del archivo lleva la etiqueta de la release.
      - name: Build Debian package
        run: bash installer/linux/build_deb.sh

      - name: Create portable archive and checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          deb="$(ls installer/linux/output/*.deb)"
          cp "$deb" "dist/Orbitask-$TAG-linux-amd64.deb"
          tar -C build/linux/x64/release/bundle \
            -czf "dist/Orbitask-$TAG-linux-x64-portable.tar.gz" .
          cd dist
          sha256sum \
            "Orbitask-$TAG-linux-amd64.deb" \
            "Orbitask-$TAG-linux-x64-portable.tar.gz" \
            > "SHA256SUMS-linux-$TAG.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-linux
          path: dist/

  publish:
    name: Publish Linux ${{ inputs.tag }}
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mismo grupo en Android, Linux y Windows: la publicación de una etiqueta
    # va en serie para que no se creen dos borradores a la vez.
    concurrency:
      group: release-publish-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-linux
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          bash .github/scripts/release_draft.sh publish "$TAG" "$PRERELEASE" \
            "dist/Orbitask-$TAG-linux-amd64.deb" \
            "dist/Orbitask-$TAG-linux-x64-portable.tar.gz" \
            "dist/SHA256SUMS-linux-$TAG.txt"
