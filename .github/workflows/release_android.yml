name: Release Orbitask Android

# Compila un APK firmado de la rama elegida en "Use workflow from" y lo deja
# en un BORRADOR de release (nunca publica ni modifica una release ya
# publicada). Si los workflows de Linux o Windows ya crearon el borrador de la
# misma etiqueta, el APK se añade a él. Después, en Releases, se revisa el
# borrador, se pegan las notas y se publica (marcando "pre-release" si es una
# versión de prueba). Ver .github/scripts/release_draft.sh.
#
# Necesita en Settings → Secrets and variables → Actions:
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (por ejemplo v0.10-dev)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-android-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that the release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/release_draft.sh check "$TAG"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto ANDROID_$name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-keystore.jks"
          } > android/key.properties

      - name: Build APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_REDIRECT_URL: com.darkhmdda.orbitask://login-callback
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::error::Falta la variable de repositorio SUPABASE_URL"; exit 1; fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then echo "::error::Falta la variable de repositorio SUPABASE_PUBLISHABLE_KEY"; exit 1; fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_AUTH_REDIRECT_URL="$SUPABASE_AUTH_REDIRECT_URL" \
            --dart-define=ORBITASK_TAG="$TAG"

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release-keystore.jks android/key.properties

      - name: Rename APK and checksum
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "Orbitask-$TAG-android.apk"
          sha256sum "Orbitask-$TAG-android.apk" > "Orbitask-$TAG-android.apk.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-android
          path: |
            Orbitask-${{ inputs.tag }}-android.apk
            Orbitask-${{ inputs.tag }}-android.apk.sha256

  publish:
    name: Publish Android ${{ inputs.tag }}
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mismo grupo en Android, Linux y Windows: la publicación de una etiqueta
    # va en serie para que no se creen dos borradores a la vez.
    concurrency:
      group: release-publish-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Orbitask-${{ inputs.tag }}-android
          path: dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          bash .github/scripts/release_draft.sh publish "$TAG" "$PRERELEASE" \
            "dist/Orbitask-$TAG-android.apk" \
            "dist/Orbitask-$TAG-android.apk.sha256"
